<svg xmlns="http://www.w3.org/2000/svg" width="1345" height="750" viewBox="0 0 1345 750" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Wireframe 6: login on a phone</title>
<desc id="d">Three greyscale phone screens: the empty login form with the rocket icon and tagline, the form with a wrong email or password message, and the button while logging in.</desc>
<style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,"DejaVu Sans",sans-serif;fill:#222}</style>
<rect x="0" y="0" width="1345" height="750" rx="0" fill="#fafafa" stroke="none" stroke-width="0"/>
<text x="40" y="34" style="font-size:20px;font-weight:700">Wireframe 6 · Login · phone (375 px)</text>
<text x="40" y="56" style="fill:#666;font-size:12px">Route: /login (the only page without the app shell). Greyscale layout only: colours, fonts and icons are placeholders. Names and numbers are made up.</text>
<circle cx="51" cy="94" r="11" fill="#e8741a"/>
<text x="51" y="98" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">A</text>
<text x="70" y="99" style="font-size:15px;font-weight:700">Login</text>
<g transform="translate(40,110)">
<rect x="0" y="0" width="375" height="540" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="340" cy="28" r="9" fill="#fff" stroke="#222" stroke-width="1.8"/><path d="M340,19 A9,9 0 0 1 340,37Z" fill="#222"/>
<g transform="translate(187.5,92) scale(2.2)"><path d="M0,-14 C9,-6 9,6 5,12 L-5,12 C-9,6 -9,-6 0,-14Z" fill="#fff" stroke="#222" stroke-width="1.8"/><circle cx="0" cy="-3" r="3" fill="none" stroke="#222" stroke-width="1.6"/><path d="M-5,6 L-11,13 L-5,12Z M5,6 L11,13 L5,12Z" fill="#222"/><path d="M-3,14 L0,21 L3,14Z" fill="#e8741a"/></g>
<text x="187.5" y="156" text-anchor="middle" style="font-size:24px;font-weight:700">LiftOff Comp</text>
<text x="187.5" y="178" text-anchor="middle" style="fill:#555;font-size:13px">Know when you're up.</text>
<text x="16" y="218" style="font-size:12px;font-weight:700">Email<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="224" width="343" height="38" rx="8" fill="#fff" stroke="#e8741a" stroke-width="3"/>
<text x="28" y="248" style="fill:#999;font-size:14px">name@club.se</text>
<line x1="30.0" y1="233" x2="30.0" y2="253" stroke="#222" stroke-width="1.8"/>
<text x="16" y="284" style="font-size:12px;font-weight:700">Password<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="290" width="343" height="38" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="28" y="314" style="fill:#999;font-size:14px">Your password</text>
<text x="341" y="313" text-anchor="end" style="font-size:12px;font-weight:700">Show</text>
<rect x="16" y="350" width="343" height="46" rx="10" fill="#222" stroke="none" stroke-width="0"/>
<text x="187.5" y="379" text-anchor="middle" style="fill:#fff;font-size:16px;font-weight:700">Log in</text>
<text x="187.5" y="426" text-anchor="middle" style="fill:#666;font-size:11.5px">Accounts are created by your coach or an admin.</text>
</g>
<text x="44" y="676" style="fill:#333;font-size:12.5px">Nothing to explore before login: rocket, name, tagline and</text>
<text x="44" y="693" style="fill:#333;font-size:12.5px">two fields. No sign-up link, accounts are created by a coach</text>
<text x="44" y="710" style="fill:#333;font-size:12.5px">or an admin. The theme toggle works here too.</text>
<circle cx="496" cy="94" r="11" fill="#e8741a"/>
<text x="496" y="98" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">B</text>
<text x="515" y="99" style="font-size:15px;font-weight:700">Wrong email or password</text>
<g transform="translate(485,110)">
<rect x="0" y="0" width="375" height="540" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="340" cy="28" r="9" fill="#fff" stroke="#222" stroke-width="1.8"/><path d="M340,19 A9,9 0 0 1 340,37Z" fill="#222"/>
<g transform="translate(187.5,92) scale(2.2)"><path d="M0,-14 C9,-6 9,6 5,12 L-5,12 C-9,6 -9,-6 0,-14Z" fill="#fff" stroke="#222" stroke-width="1.8"/><circle cx="0" cy="-3" r="3" fill="none" stroke="#222" stroke-width="1.6"/><path d="M-5,6 L-11,13 L-5,12Z M5,6 L11,13 L5,12Z" fill="#222"/><path d="M-3,14 L0,21 L3,14Z" fill="#e8741a"/></g>
<text x="187.5" y="156" text-anchor="middle" style="font-size:24px;font-weight:700">LiftOff Comp</text>
<text x="187.5" y="178" text-anchor="middle" style="fill:#555;font-size:13px">Know when you're up.</text>
<rect x="16" y="206" width="343" height="44" rx="8" fill="#fbeaea" stroke="#b3382f" stroke-width="1.3"/>
<circle cx="34" cy="228" r="8" fill="#b3382f"/>
<text x="34" y="232" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:700">!</text>
<text x="50" y="233" style="fill:#7a1a17;font-size:12.5px;font-weight:700">Wrong email or password</text>
<text x="16" y="274" style="font-size:12px;font-weight:700">Email<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="280" width="343" height="38" rx="8" fill="#fff" stroke="#b3382f" stroke-width="3"/>
<text x="28" y="304" style="font-size:14px">anna@sk-atlas.se</text>
<text x="16" y="340" style="font-size:12px;font-weight:700">Password<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="346" width="343" height="38" rx="8" fill="#fff" stroke="#b3382f" stroke-width="3"/>
<text x="28" y="370" style="fill:#999;font-size:14px">Your password</text>
<text x="341" y="369" text-anchor="end" style="font-size:12px;font-weight:700">Show</text>
<rect x="16" y="406" width="343" height="46" rx="10" fill="#222" stroke="none" stroke-width="0"/>
<text x="187.5" y="435" text-anchor="middle" style="fill:#fff;font-size:16px;font-weight:700">Log in</text>
<text x="187.5" y="482" text-anchor="middle" style="fill:#666;font-size:11.5px">Accounts are created by your coach or an admin.</text>
</g>
<text x="489" y="676" style="fill:#333;font-size:12.5px">One message that does not say which field was wrong. The</text>
<text x="489" y="693" style="fill:#333;font-size:12.5px">email stays, the password is cleared. The message is read</text>
<text x="489" y="710" style="fill:#333;font-size:12.5px">out to screen readers (role alert).</text>
<circle cx="941" cy="94" r="11" fill="#e8741a"/>
<text x="941" y="98" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">C</text>
<text x="960" y="99" style="font-size:15px;font-weight:700">Logging in</text>
<g transform="translate(930,110)">
<rect x="0" y="0" width="375" height="540" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="340" cy="28" r="9" fill="#fff" stroke="#222" stroke-width="1.8"/><path d="M340,19 A9,9 0 0 1 340,37Z" fill="#222"/>
<g transform="translate(187.5,92) scale(2.2)"><path d="M0,-14 C9,-6 9,6 5,12 L-5,12 C-9,6 -9,-6 0,-14Z" fill="#fff" stroke="#222" stroke-width="1.8"/><circle cx="0" cy="-3" r="3" fill="none" stroke="#222" stroke-width="1.6"/><path d="M-5,6 L-11,13 L-5,12Z M5,6 L11,13 L5,12Z" fill="#222"/><path d="M-3,14 L0,21 L3,14Z" fill="#e8741a"/></g>
<text x="187.5" y="156" text-anchor="middle" style="font-size:24px;font-weight:700">LiftOff Comp</text>
<text x="187.5" y="178" text-anchor="middle" style="fill:#555;font-size:13px">Know when you're up.</text>
<text x="16" y="218" style="font-size:12px;font-weight:700">Email<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="224" width="343" height="38" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="28" y="248" style="font-size:14px">anna@sk-atlas.se</text>
<text x="16" y="284" style="font-size:12px;font-weight:700">Password<tspan style="fill:#c25e0a;font-size:14px"> *</tspan></text>
<rect x="16" y="290" width="343" height="38" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="28" y="314" style="font-size:14px">••••••••••</text>
<text x="341" y="313" text-anchor="end" style="font-size:12px;font-weight:700">Show</text>
<rect x="16" y="350" width="343" height="46" rx="10" fill="#d4d4d4" stroke="#aaa" stroke-width="1"/>
<text x="187.5" y="379" text-anchor="middle" style="fill:#777;font-size:16px;font-weight:700">Logging in…</text>
<text x="187.5" y="426" text-anchor="middle" style="fill:#666;font-size:11.5px">Accounts are created by your coach or an admin.</text>
</g>
<text x="934" y="676" style="fill:#333;font-size:12.5px">The button is disabled while the request runs, so a double</text>
<text x="934" y="693" style="fill:#333;font-size:12.5px">tap on a slow hall network does not send it twice.</text>
<text x="934" y="710" style="fill:#333;font-size:12.5px">Password reset by email is not in the first slice.</text>
</svg>